name: Build Plex macOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-release:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: build/DerivedData
          key: deriveddata-macos-arm64-v1

      - name: Configure xcconfig
        run: |
          cp Config/Config-example.xcconfig Config/Config.xcconfig
          printf '\nPRODUCT_BUNDLE_IDENTIFIER = tv.plex.macos.custom\n' >> Config/Config.xcconfig
          touch Config/Config-TopShelf.xcconfig

      - name: Build Native macOS Release (Plex.app)
        run: |
          xcodebuild \
            -project Strimr.xcodeproj \
            -scheme Strimr-macOS \
            -destination 'platform=macOS,arch=arm64' \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            build

      - name: Ad-hoc sign and package Plex.app
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release/Plex.app"
          ls -la "$APP_PATH"
          codesign --force --deep --sign - --entitlements Strimr-macOS/Strimr-macOS.entitlements "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" build/Plex-macOS.zip
          ls -lh build/Plex-macOS.zip

      - name: Upload Plex.app Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Plex-macOS
          path: build/Plex-macOS.zip
          if-no-files-found: error

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.3.4-plex build/Plex-macOS.zip \
            --title "Plex macOS Native" \
            --notes "Custom native macOS Plex build" \
          || gh release upload v1.3.4-plex build/Plex-macOS.zip --clobber
